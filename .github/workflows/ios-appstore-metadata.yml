name: "iOS App Store Metadata"

# Publishes src/openrct2-ios/app-store to App Store Connect: app settings (app.json),
# product-page copy (locales/*/metadata.json), screenshots and release notes.
# Only ever updates the latest editable App Store version; it never creates one.
# The copyright line and App Review information are entered in App Store Connect and left alone here.

on:
  push:
    branches: [ios]
    paths: ["src/openrct2-ios/app-store/**"]
  pull_request:
    paths: ["src/openrct2-ios/app-store/**"]
  workflow_dispatch:
    inputs:
      command:
        description: "Action to run"
        type: choice
        default: inspect
        options:
          - inspect      # read-only comparison with App Store Connect
          - push-app     # app.json: categories, age rating, release type, price, availability
          - push-text    # product-page copy and release notes
          - push-shots   # replace screenshots
          - push-all     # all of the above
      dry_run:
        description: "Dry run (print actions, write nothing); applies to push-* only"
        type: boolean
        default: true
      locales:
        description: "Locale folders, space-separated (blank = all), e.g. 'zh-Hans ja'"
        type: string
        default: ""
      devices:
        description: "Devices for push-shots: 'ipad iphone', 'ipad' or 'iphone'"
        type: string
        default: "ipad iphone"
      version_id:
        description: "Pin an appStoreVersion id (blank = latest editable)"
        type: string
        default: ""

# Never let two publish runs race on the same App Store version.
concurrency:
  group: ios-appstore-metadata
  cancel-in-progress: false

defaults:
  run:
    working-directory: src/openrct2-ios/app-store

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate
        run: python3 asc_publish.py validate

      # A push publishes for real: screenshots only when a PNG changed, otherwise settings and copy.
      - name: Choose command
        if: github.event_name != 'pull_request'
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "command=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run && '1' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] ||
               git diff --name-only "$BEFORE" "$GITHUB_SHA" -- . | grep -q '\.png$'; then
            echo "command=push-all" >> "$GITHUB_OUTPUT"
          else
            echo "command=push-app push-text" >> "$GITHUB_OUTPUT"
          fi

      - name: Write API key
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Secret ASC_KEY_P8 is not available to this repository."
            exit 1
          fi
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_LOCALES: ${{ inputs.locales }}
          ASC_DEVICES: ${{ inputs.devices }}
          ASC_VERSION_ID: ${{ inputs.version_id }}
          ASC_DRY_RUN: ${{ steps.plan.outputs.dry }}
          ASC_SKIP_WITHOUT_VERSION: ${{ github.event_name == 'push' && '1' || '' }}
        run: |
          for command in ${{ steps.plan.outputs.command }}; do
            python3 asc_publish.py "$command"
          done

      - name: Clean up API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
